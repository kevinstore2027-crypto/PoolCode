kevinstore: POOLCODE Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: poolcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read on-chain state and update files
        id: sync
        env:
          RPC_PROVIDER_URL: ${{ secrets.RPC_PROVIDER_URL }}
          HOOK_CONTRACT_ADDRESS: ${{ secrets.HOOK_CONTRACT_ADDRESS }}
        run: node scripts/sync.js

      - name: Detect file changes
        id: diff
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed - no commit."
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- README.md CHANGELOG.md
          fi

      - name: Commit and push
        if: steps.diff.outputs.dirty == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.sync.outputs.commit_message }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create the release
        if: steps.sync.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.sync.outputs.release_tag }}
          TITLE: ${{ steps.sync.outputs.release_name }}
          MODULE: ${{ steps.sync.outputs.release_module }}
          BLOCK: ${{ steps.sync.outputs.release_block }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            exit 0
          fi

          if [ -n "$BLOCK" ]; then
            ACTIVATED="Ethereum block $BLOCK"
          else
            ACTIVATED="Ethereum mainnet"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$(printf 'Module:\n%s\n\nActivated:\n%s\n' "$MODULE" "$ACTIVATED")"
